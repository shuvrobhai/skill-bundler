[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bundium"
version = "0.2.1"
description = "Bundle a folder of Markdown files (e.g. an AI agent skill) into one self-contained document."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
bundium = "bundium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
